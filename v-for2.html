<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>My first Vue app</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" >
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/vue@3.5.0/dist/vue.global.js"></script>
  </head>

  <body>
    <h1 class="bg-primary text-white display-4 px-3">Vue3</h1>
    <div id="app" class="container">
      <p>{{ message }}</p>
      <table class="table">
        <tr class="thead-dark">
          <th>Name</th>
          <th>Mail</th>
          <th>Tel</th>
        </tr>
        <tr v-for="item in items">
          <td>{{item.name}}</td>
          <td>{{item.mail}}</td>
          <td>{{item.tel}}</td>
        </tr>
    </table>
    </div>
    
    
    
    <script>
    const appdata = {
      data() {
        return {
          message: '※データをテーブル表示する',
          items: []
        }
      },
      mounted() {
        const backendEndpoint = 'http://localhost:30165/notes_from_b';

        // AXIOSを使用してデータを取得
        axios.get(backendEndpoint)
        .then(response => {
          this.items = response.data;
          console.log(this.items);
        })
        .catch(error => {
          console.error('データの取得に失敗しました',error);
        })
      }
    }

    Vue.createApp(appdata).mount('#app')
    </script>
  </body>
</html>
